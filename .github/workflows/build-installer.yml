name: Build Mimar Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # Needed to publish GitHub Releases, which the app checks for updates.
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build client (Vite)
        run: npm run build

      # Publish a release for pushes to main whose version has no complete release yet (one without
      # latest.yml counts as incomplete, e.g. a draft published by hand too early), so merging
      # without a version bump just builds. electron-builder only builds; the gh CLI creates the
      # release, uploads the files (replacing any partial ones) and then makes it public.
      - name: Decide whether to publish a release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ASSETS=$(gh release view "v$VERSION" --repo "$REPO" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] \
             && ! grep -qxF latest.yml <<< "$ASSETS"; then
            echo "Publishing release v$VERSION"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not publishing (release v$VERSION is complete or this is not a push to main)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Windows installer and portable app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Publish the release
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          FILES=("release/Mimar-Setup-$VERSION.exe" "release/Mimar-Setup-$VERSION.exe.blockmap" \
                 "release/Mimar-Portable-$VERSION.exe" "release/latest.yml")
          for f in "${FILES[@]}"; do
            [ -f "$f" ] || { echo "Build did not produce $f"; exit 1; }
          done
          if ! gh release view "v$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "v$VERSION" --repo "$REPO" --draft --target "$GITHUB_SHA" --title "$VERSION" \
              --notes "Mimar $VERSION"
          fi
          gh release upload "v$VERSION" --repo "$REPO" --clobber "${FILES[@]}"
          gh release edit "v$VERSION" --repo "$REPO" --draft=false --prerelease=false --latest

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mimar-windows-installer
          path: release/*.exe
