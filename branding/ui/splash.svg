      <path d="M40 380 L120 40 L200 380 L280 40 L360 380" fill="none" stroke="#D4AF37" stroke-width="28" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="420" y="260" font-family="Times New Roman, serif" font-size="120" fill="#D4AF37">Mimar</text>
      <text x="420" y="330" font-family="Times New Roman, serif" font-size="36" fill="#D4AF37" opacity="0.9">مِعمار</text>
