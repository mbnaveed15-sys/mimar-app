<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <rect width="100%" height="100%" fill="#0b0b0b"/>
  <g transform="translate(60,60)">
    <!-- Stylized M (geometric) -->
    <path d="M40 480 L120 80 L200 480 L280 80 L360 480" fill="none" stroke="#D4AF37" stroke-width="28" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Arabic integrated stroke as smaller path under first peak -->
    <path d="M180 320 C160 300 140 260 180 240" fill="none" stroke="#D4AF37" stroke-width="14" stroke-linecap="round"/>
    <!-- Wordmark - serif style (approximation) -->
    <text x="420" y="280" font-family='Times New Roman, serif' font-size="140" fill="#D4AF37">Mimar</text>
    <text x="420" y="360" font-family='Times New Roman, serif' font-size="40" fill="#D4AF37" opacity="0.9">مِعمار</text>
    <text x="420" y="430" font-family='Times New Roman, serif' font-size="30" fill="#D4AF37" opacity="0.7">1.2</text>
  </g>
</svg>